name: Publish to TestPyPI and PyPI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: The scikit-learn maintenance branch to release from, e.g. 1.10.X
        required: true
        type: string

run-name: Publish scikit-learn from ${{ inputs.ref }}

permissions:
  contents: read

jobs:
  check_ref:
    name: Check ref is a maintenance branch
    runs-on: ubuntu-latest
    if: github.repository == 'scikit-learn/scikit-learn-release'
    steps:
      - env:
          REF: ${{ inputs.ref }}
        run: |
          if [[ ! "$REF" =~ ^[0-9]+\.[0-9]+\.X$ ]]; then
            echo "ref must be a maintenance branch, e.g. 1.10.X (got '$REF')"
            exit 1
          fi

  build:
    name: Build sdist and wheels
    needs: [check_ref]
    uses: ./.github/workflows/build-wheels.yml
    with:
      ref: ${{ inputs.ref }}

  testpypi-publish:
    name: Publish release to TestPyPI
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: testpypi
      url: https://test.pypi.org/p/scikit-learn
    permissions:
      id-token: write  # mandatory for trusted publishing
    steps:
      - name: Download sdist and wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: View artifacts
        run: ls -l dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          print-hash: true
          attestations: true

  pypi-publish:
    name: Publish release to PyPI
    runs-on: ubuntu-latest
    needs: [testpypi-publish]
    environment:
      name: pypi
      url: https://pypi.org/p/scikit-learn
    permissions:
      id-token: write  # mandatory for trusted publishing
    steps:
      - name: Download sdist and wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: View artifacts
        run: ls -l dist

      # Check that the sdist version is already a tag, pointing at the commit these
      # artifacts were built from.
      - name: Check tag matches the built commit
        run: |
          set -euo pipefail
          version=$(basename dist/scikit_learn-*.tar.gz .tar.gz)
          version=${version#scikit_learn-}
          built=$(cat sklearn-sha.txt)
          echo "publishing scikit-learn $version, built from $built"
          git clone --depth 1 --branch "$version" https://github.com/scikit-learn/scikit-learn.git sklearn-tag
          tagged=$(git -C sklearn-tag rev-parse HEAD)
          echo "tag $version: $tagged"
          if [[ "$built" != "$tagged" ]]; then
            echo "tag $version must point at the commit that produced these artifacts."
            exit 1
          fi

      - name: Publish
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          print-hash: true
          attestations: true
