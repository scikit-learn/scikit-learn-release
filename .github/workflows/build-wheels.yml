name: Build sdist and wheels

on:
  pull_request:
    branches:
      - main
  # Reusable entry point. Callers pass `ref` (sklearn SHA/branch/PR merge ref):
  # - nightly.yml: sklearn@main, then uploads to Anaconda
  # - scikit-learn wheels.yml: PR head when the commit has [cd build]
  workflow_call:
    inputs:
      ref:
        description: The scikit-learn branch, tag, SHA, or refs/pull/N/merge to build
        required: false
        default: main
        type: string
  # Manual "Run workflow" on this repo, usually after the sklearn release PR is merged.
  workflow_dispatch:
    inputs:
      ref:
        description: The scikit-learn branch, tag, SHA, or refs/pull/N/merge to build
        required: true
        type: string

concurrency:
  group: build-wheels-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

run-name: Build sklearn ${{ inputs.ref || 'main' }}

permissions:
  contents: read

jobs:
  build_wheels:
    name: Build wheel for cp${{ matrix.python }}-${{ matrix.platform_id }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Window 64 bit
          - os: windows-latest
            python: 312
            platform_id: win_amd64
          - os: windows-latest
            python: 313
            platform_id: win_amd64
          - os: windows-latest
            python: 314
            platform_id: win_amd64
          - os: windows-latest
            python: 314t
            platform_id: win_amd64
          - os: windows-latest
            python: 315
            platform_id: win_amd64
          - os: windows-latest
            python: 315t
            platform_id: win_amd64

          # Windows on ARM64 (WoA)
          - os: windows-11-arm
            python: 312
            platform_id: win_arm64
          - os: windows-11-arm
            python: 313
            platform_id: win_arm64
          - os: windows-11-arm
            python: 314
            platform_id: win_arm64
          - os: windows-11-arm
            python: 314t
            platform_id: win_arm64
          - os: windows-11-arm
            python: 315
            platform_id: win_arm64
          - os: windows-11-arm
            python: 315t
            platform_id: win_arm64

          # Linux
          - os: ubuntu-latest
            python: 312
            platform_id: manylinux_x86_64
          - os: ubuntu-latest
            python: 313
            platform_id: manylinux_x86_64
          - os: ubuntu-latest
            python: 314
            platform_id: manylinux_x86_64
          - os: ubuntu-latest
            python: 314t
            platform_id: manylinux_x86_64
          - os: ubuntu-latest
            python: 315
            platform_id: manylinux_x86_64
          - os: ubuntu-latest
            python: 315t
            platform_id: manylinux_x86_64

          # Linux arm
          - os: ubuntu-24.04-arm
            python: 312
            platform_id: manylinux_aarch64
          - os: ubuntu-24.04-arm
            python: 313
            platform_id: manylinux_aarch64
          - os: ubuntu-24.04-arm
            python: 314
            platform_id: manylinux_aarch64
          - os: ubuntu-24.04-arm
            python: 314t
            platform_id: manylinux_aarch64
          - os: ubuntu-24.04-arm
            python: 315
            platform_id: manylinux_aarch64
          - os: ubuntu-24.04-arm
            python: 315t
            platform_id: manylinux_aarch64

          # MacOS x86_64
          - os: macos-15-intel
            python: 312
            platform_id: macosx_x86_64
          - os: macos-15-intel
            python: 313
            platform_id: macosx_x86_64
          - os: macos-15-intel
            python: 314
            platform_id: macosx_x86_64
          - os: macos-15-intel
            python: 314t
            platform_id: macosx_x86_64
          - os: macos-15-intel
            python: 315
            platform_id: macosx_x86_64
          - os: macos-15-intel
            python: 315t
            platform_id: macosx_x86_64

          # MacOS arm64
          - os: macos-14
            python: 312
            platform_id: macosx_arm64
          - os: macos-14
            python: 313
            platform_id: macosx_arm64
          - os: macos-14
            python: 314
            platform_id: macosx_arm64
          - os: macos-14
            python: 314t
            platform_id: macosx_arm64
          - os: macos-14
            python: 315
            platform_id: macosx_arm64
          - os: macos-14
            python: 315t
            platform_id: macosx_arm64

    steps:
      - name: Checkout scikit-learn-release
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # This workflow may be called from scikit-learn ([cd build]). Make sure to
          # checkout the repository and commit this workflow file comes from.
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      - name: Checkout scikit-learn
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: scikit-learn/scikit-learn
          ref: ${{ inputs.ref || 'main' }}
          path: scikit-learn-src
          persist-credentials: false

      - uses: mamba-org/setup-micromamba@d7c9bd84e824b79d2af72a2d4196c7f4300d3476 # v3.0.0
        if: ${{ startsWith(matrix.platform_id, 'macosx') }}
        with:
          micromamba-version: '2.8.1-0'

      - name: Set-up macOS
        if: ${{ startsWith(matrix.platform_id, 'macosx') }}
        run: bash tools/configure_macos_env.sh

      - name: Set SOURCE_DATE_EPOCH from source commit
        run: |
          echo "SOURCE_DATE_EPOCH=$(git -C scikit-learn-src log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Build and test wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0
        env:
          CIBW_BUILD: cp${{ matrix.python }}-${{ matrix.platform_id }}
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
          PYTHONHASHSEED: "0"
          CIBW_ENVIRONMENT_PASS_LINUX: SOURCE_DATE_EPOCH PYTHONHASHSEED RUNNER_OS
        with:
          package-dir: scikit-learn-src
          output-dir: dist
          config-file: cibuildwheel.toml

      - name: Test Windows wheel in a minimal Docker image
        # Currently Windows ARM64 runners do not have Docker support and there
        # is no Docker image with free-threaded
        # TODO Add Python 3.15 when it is released and a winamd64/python:315-windowsservercore
        # Docker image is available
        if: ${{ matrix.platform_id == 'win_amd64' && !contains(matrix.python, 't') && !contains(matrix.python, '315') }}
        run: |
          pwsh tools/wait-for-docker-windows.ps1
          bash tools/test_windows_wheels_in_docker.sh ${{ matrix.python }}

      - name: Store artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cibw-wheels-cp${{ matrix.python }}-${{ matrix.platform_id }}
          # `**/` is what keeps the dist/ prefix inside the artifact: the artifact root
          # is the path prefix before the first wildcard.
          path: "**/dist/*.whl"

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout scikit-learn-release
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # This workflow may be called from scikit-learn ([cd build]). Make sure to
          # checkout the repository and commit this workflow file comes from.
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      - name: Checkout scikit-learn
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: scikit-learn/scikit-learn
          ref: ${{ inputs.ref || 'main' }}
          path: scikit-learn-src
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # 6.2.0
        with:
          python-version: "3.12"

      - name: Build source distribution
        run: bash tools/build_source.sh

      - name: Test source distribution
        run: bash tools/test_source.sh
        env:
          SKLEARN_SKIP_NETWORK_TESTS: 1

      # publish.yml checks this against the release tag before uploading to PyPI.
      - name: Record scikit-learn commit
        run: git -C scikit-learn-src rev-parse HEAD | tee sklearn-sha.txt

      - name: Store artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cibw-sdist
          path:
            dist
            sklearn-sha.txt
