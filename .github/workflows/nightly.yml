name: Nightly wheels

on:
  schedule:
    # 01:01 UTC every day
    - cron: "1 1 * * *"

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheels
    if: github.repository == 'scikit-learn/scikit-learn-release'
    uses: ./.github/workflows/build-wheels.yml
    with:
      ref: main

  nightly_upload:
    name: Nightly upload
    runs-on: ubuntu-latest
    environment: upload_anaconda
    needs: [build]

    steps:
      - name: Download sdist and wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Install micromamba
        uses: mamba-org/setup-micromamba@d7c9bd84e824b79d2af72a2d4196c7f4300d3476 # v3.0.0
        with:
          # For installation of anaconda-client, required for upload to anaconda.org
          init-shell: bash
          environment-name: upload-env
          create-args: >-
            anaconda-client

      - name: Upload to anaconda.org
        shell: bash -el {0}
        env:
          # anaconda-client uses this env var as the default token.
          ANACONDA_API_TOKEN: ${{ secrets.SCIKIT_LEARN_NIGHTLY_UPLOAD_TOKEN }}
        run: |
          anaconda -q upload --force -u scientific-python-nightly-wheels ./dist/*
